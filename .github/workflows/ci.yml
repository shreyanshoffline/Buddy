name: Tests

# The full offline test suite runs HERE (and only here). Release builds skip it so a flaky
# test can never block a shipping build; they run the app's own --smoke-test instead.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System packages for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest Pillow pyyaml
      - name: Offline test suite (Linux, under a virtual display)
        if: runner.os == 'Linux'
        env:
          BUDDY_DATA_DIR: ${{ runner.temp }}/buddy-test-data
        run: xvfb-run -a python -m pytest -q tests
      - name: Offline test suite (Windows)
        if: runner.os == 'Windows'
        env:
          BUDDY_DATA_DIR: ${{ runner.temp }}/buddy-test-data
        run: python -m pytest -q tests

  # Seconds-to-minutes checks that catch workflow/script mistakes BEFORE a 1.5-hour release build.
  packaging-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install actionlint-py shellcheck-py Pillow
      - name: Lint the workflows (syntax, expressions, contexts)
        run: actionlint .github/workflows/release.yml .github/workflows/ci.yml
      - name: Lint the shell scripts
        run: shellcheck -S warning packaging/macos/verify_dmg.sh packaging/linux/*.sh
      - name: Dry-run the Linux packaging (.deb + AppImage) with a stand-in app
        run: bash packaging/linux/dry_run.sh
