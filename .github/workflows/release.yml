name: Buddy release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash packaging/build_mac.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Buddy-macOS.zip
            dist/Buddy-macOS.zip.sha256
          generate_release_notes: true
