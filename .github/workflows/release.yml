name: Buddy release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest google-api-python-client google-auth-oauthlib
      - name: Build macOS app
        if: matrix.target == 'macos'
        run: bash packaging/build_mac.sh
      - name: Build portable desktop app
        if: matrix.target != 'macos'
        run: python packaging/build.py
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: buddy-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
